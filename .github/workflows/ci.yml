name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build -w @bigmobility/vinyl-ui

      - name: Codegen
        run: npm run css -w docs

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm run test
